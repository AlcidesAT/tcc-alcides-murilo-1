# Acrescenta a placa de vídeo NVIDIA ao Ollama (requer o NVIDIA Container
# Toolkit instalado no servidor). Uso:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build

services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
