<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar — Consulta Inteligente</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-brand">
            <h1>Consulta Inteligente</h1>
            <p>Sistema RAG para Artigos Científicos</p>
        </div>

        <div class="auth-tabs">
            <button class="auth-tab active" data-tab="login">Entrar</button>
            <button class="auth-tab" data-tab="register">Cadastrar</button>
        </div>

        <form id="login-form" class="auth-form">
            <div class="auth-field">
                <label for="login-email">E-mail</label>
                <input type="email" id="login-email" placeholder="seu@email.com" required autocomplete="email" />
            </div>
            <div class="auth-field">
                <label for="login-password">Senha</label>
                <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password" />
            </div>
            <div id="login-error" class="auth-error" hidden></div>
            <button type="submit" class="primary auth-submit" id="login-btn">Entrar</button>
        </form>

        <form id="register-form" class="auth-form" hidden>
            <div class="auth-field">
                <label for="reg-name">Nome</label>
                <input type="text" id="reg-name" placeholder="Seu nome completo" required autocomplete="name" />
            </div>
            <div class="auth-field">
                <label for="reg-email">E-mail</label>
                <input type="email" id="reg-email" placeholder="seu@email.com" required autocomplete="email" />
            </div>
            <div class="auth-field">
                <label for="reg-password">Senha</label>
                <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password" />
            </div>
            <div class="auth-field">
                <label for="reg-confirm">Confirmar senha</label>
                <input type="password" id="reg-confirm" placeholder="Repita a senha" required autocomplete="new-password" />
            </div>
            <div id="register-error" class="auth-error" hidden></div>
            <button type="submit" class="primary auth-submit" id="register-btn">Criar conta</button>
        </form>

        <div class="auth-footer">
            <a href="/">Continuar sem cadastro →</a>
        </div>
    </div>

    <script type="module" src="/static/js/login.js"></script>
</body>
</html>
